[project]
name = "sitescore"
version = "0.1.0"
description = "Pluggable scorer for donor/acceptor/start/stop sites; emits UniAnn score tables"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
convmamba = ["torch>=2.6", "matplotlib", "mamba-ssm>=2.3"]
test = ["pytest"]

[project.scripts]
sitescore = "sitescore.cli:main"

[project.entry-points."sitescore.models"]
convmamba = "sitescore.models.convmamba.adapter:ConvMambaSiteModel"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sitescore*"]
